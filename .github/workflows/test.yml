name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Vet
        run: go vet ./...
      - name: Unit tests with race detector
        run: go test -race ./...
      - name: Build
        run: go build -o ./bin/oobverify ./cmd/oobverify
      - name: Version contract
        run: test "$(./bin/oobverify -version)" = "oobverify 0.1.0"
      - name: Linux arm64 build
        run: GOOS=linux GOARCH=arm64 go build -o ./bin/oobverify-linux-arm64 ./cmd/oobverify
      - name: Bafflewick CLI challenge
        shell: bash
        run: |
          out=$(./bin/oobverify -input examples/bafflewick/challenge-request.json)
          echo "$out" | grep -q '"verified":true'
          echo "$out" | grep -q 'insurer-contact'
      - name: Callback boundary acceptance
        run: go test ./internal/oob -run 'TestCallbackIgnoresInboundContact|TestCallbackExpiryAndWrongPerson|TestVerificationResultCarriesNoBusinessApproval' -count=1
