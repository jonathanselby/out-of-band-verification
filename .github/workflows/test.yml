name: test

on:
  push:
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Format contract
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests with race detector
        run: go test -race -count=1 ./...
      - name: Build
        run: go build -o ./bin/oobverify ./cmd/oobverify
      - name: Version contract
        run: test "$(./bin/oobverify -version)" = "oobverify 0.1.0"
      - name: Linux arm64 build
        run: GOOS=linux GOARCH=arm64 go build -o ./bin/oobverify-linux-arm64 ./cmd/oobverify
      - name: Bafflewick security-boundary acceptance
        run: >-
          go test ./internal/oob
          -run 'TestChallenge|TestChallengeSecurityFloorsAndValidation|TestCallbackIgnoresInboundContact|TestCallbackSessionIntegrity|TestCallbackExpiryWrongPersonTokenAndConnection|TestCallbackKeyAndTTLBounds'
          -count=1
